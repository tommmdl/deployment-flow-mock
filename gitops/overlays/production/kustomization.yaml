apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: deployment-flow
    newName: ghcr.io/tommmdl/gitops-delivery-platform
    digest: sha256:eb517cc28d47f2dd4ee50af8e39425971224188e307e07981bc223162d90280c
patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: api}
      spec:
        template:
          spec:
            imagePullSecrets: [{name: ghcr-pull}]
