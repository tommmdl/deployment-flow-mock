groups:
  - name: api-slo
    rules:
      - record: api:error_ratio:5m
        expr: (sum(rate(http_requests_total{job="api",status=~"5.."}[5m])) or vector(0)) / clamp_min((sum(rate(http_requests_total{job="api"}[5m])) or vector(0)), 0.001)
      - alert: APIUnavailable
        expr: up{job="api"} == 0 or absent(up{job="api"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: API não pode ser coletada
          runbook: docs/runbooks.md
      - alert: FastErrorBudgetBurn
        expr: api:error_ratio:5m > 0.0144
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Consumo rápido do orçamento de erro (14.4x para SLO 99.9%)
          runbook: docs/runbooks.md
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[5m]))) > 0.3
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: p95 acima de 300ms
          runbook: docs/runbooks.md
