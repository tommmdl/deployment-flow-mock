name: AWS plan (manual, sem apply)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aws-plan
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    environment: aws-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 900
      - name: Validate and plan only
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_VAR_owner: ${{ vars.RESOURCE_OWNER }}
          TF_VAR_budget_email: ${{ vars.BUDGET_EMAIL }}
          TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS_JSON }}
        run: |
          python3 scripts/install_tool.py terraform
          artifacts/bin/terraform -chdir=infra/aws init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=deployment-flow/production.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
          artifacts/bin/terraform -chdir=infra/aws validate
          artifacts/bin/terraform -chdir=infra/aws plan -input=false -lock-timeout=60s
