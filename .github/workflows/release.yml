name: Release
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'infra/tools.lock.json'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          provenance: mode=max
      - name: Install checksum-locked Cosign
        run: python3 scripts/install_tool.py cosign
      - name: Sign image with ephemeral OIDC identity
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: artifacts/bin/cosign sign --yes "$IMAGE@$DIGEST"
      - if: github.event.repository.private == false || vars.ENABLE_GITHUB_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
  gitops:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: gitops
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Declare digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: python3 scripts/update_digest.py "$IMAGE" "$DIGEST"
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITOPS_PR_TOKEN }}
          branch: automation/gitops-image
          delete-branch: true
          add-paths: gitops/overlays/production/kustomization.yaml
          commit-message: 'chore(gitops): atualizar digest verificado'
          title: 'chore(gitops): promover imagem assinada'
          body: 'Imagem publicada após CI. Revise digest, assinatura e proveniência antes do merge.'
